{% if is_paginated %}
<nav class="mt-6 flex flex-wrap items-center justify-between gap-2 text-sm">
  {% if page_obj.has_previous %}
    <a href="?{{ request.GET.urlencode }}&amp;page={{ page_obj.previous_page_number }}" class="rounded-lg bg-white px-4 py-2 font-medium shadow-sm ring-1 ring-slate-200 hover:bg-slate-50">← Previous</a>
  {% endif %}
  <span class="text-slate-500">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{{ request.GET.urlencode }}&amp;page={{ page_obj.next_page_number }}" class="rounded-lg bg-white px-4 py-2 font-medium shadow-sm ring-1 ring-slate-200 hover:bg-slate-50">Next →</a>
  {% endif %}
</nav>
{% endif %}
