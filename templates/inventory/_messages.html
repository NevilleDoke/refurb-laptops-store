{% if messages %}
  <div class="mb-4 space-y-2" role="status">
    {% for message in messages %}
      <div class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50/80 text-red-800{% else %}border-emerald-200 bg-emerald-50/80 text-emerald-800{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
